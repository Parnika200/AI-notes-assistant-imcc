<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Your dashboard | MindNest AI</title>
</head>
<body>
    <h1>Your dashboard</h1>
    <p>Welcome, {{ user.email|default:user.username }}.</p>
    <p>Your account is signed in.</p>

    <form action="{% url 'account_logout' %}" method="post">
        {% csrf_token %}
        <button type="submit">Log out</button>
    </form>

   
    <a href="{% url 'material_list' %}">My Notes</a>
    <a href="{% url 'material_upload' %}">Upload Material</a>
</body>
</html>
