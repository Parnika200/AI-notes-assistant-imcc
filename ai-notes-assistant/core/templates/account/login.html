<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Log in | AI Notes Assistant</title>
</head>
<body>
    <h1>Log in</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        {% if redirect_field_value %}
            <input
                type="hidden"
                name="{{ redirect_field_name }}"
                value="{{ redirect_field_value }}"
            >
        {% endif %}

        <button type="submit">Log in</button>
    </form>

    <p>
        <a href="{% url 'account_reset_password' %}">Forgot your password?</a>
    </p>

    <p>
        Don’t have an account?
        <a href="{% url 'account_signup' %}">Create one</a>
    </p>
</body>
</html>
